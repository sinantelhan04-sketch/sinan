<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <title>Tesisat Sorgulama</title>

    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tesisat" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9374/9374868.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1812481333949389" crossorigin="anonymous"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "papaparse": "https://esm.sh/papaparse@5.4.1"
  }
}

<style>
  /* Başlangıç yükleme ekranı stilleri */
  #initial-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #f3f4f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease-out;
  }
  .dark #initial-loader {
    background-color: #111827;
    color: white;
  }
  .loader-spinner {
    border: 4px solid #e5e7eb;
    border-top: 4px solid #3b82f6;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  #reset-btn-container {
    margin-top: 20px;
    display: none; /* JS ile gösterilecek */
    text-align: center;
  }
</style>
</head>
  <body class="bg-gradient-to-br from-slate-100 to-slate-300 dark:from-slate-900 dark:to-slate-800 min-h-screen bg-fixed selection:bg-blue-200 dark:selection:bg-blue-900">
    
    <!-- Yükleme Ekranı -->
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <h2 class="text-lg font-bold">Uygulama Yükleniyor...</h2>
      <p class="text-sm text-gray-500 mt-2">Lütfen bekleyin</p>
      
      <div id="reset-btn-container">
        <p class="text-red-500 text-xs mb-2">Yükleme uzun sürdü mü?</p>
        <button onclick="hardResetApp()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-red-600 transition">
          Uygulamayı Sıfırla ve Yenile
        </button>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    
    <!-- Service Worker Registration & App Health Check -->
    <script>
      // 3 saniye sonra hala loader varsa reset butonunu göster
      setTimeout(() => {
        const resetBtn = document.getElementById('reset-btn-container');
        if (resetBtn && document.getElementById('initial-loader')) {
           resetBtn.style.display = 'block';
        }
      }, 3000);

      // Uygulamayı tamamen sıfırlayan fonksiyon
      window.hardResetApp = async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        }
        localStorage.clear();
        sessionStorage.clear();
        window.location.reload(true);
      };

      // Service Worker Kaydı
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
